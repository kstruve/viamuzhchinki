<button id="sfx-toggle" class="audio-toggle" type="button" aria-label="Отключить эффекты" aria-pressed="false"></button>

<script>
(()=>{
 const music=new Audio(BACKGROUND_MUSIC);music.loop=true;music.volume=0.405;music.preload='auto';
 const sfxButton=document.getElementById('sfx-toggle'),musicButton=document.getElementById('music-toggle');
 let started=false,sfxMuted=false;
 const positionButtons=()=>{
  const canvas=document.querySelector('canvas');if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  for(const [button,x] of [[sfxButton,90],[musicButton,630]]){
   button.style.left=(rect.left+x*rect.width/720-24)+'px';
   button.style.top=(rect.top+1145*rect.height/1280-24)+'px';button.style.bottom='auto';
  }
 };
 window.addEventListener('resize',positionButtons);
 const watch=new MutationObserver(()=>{const canvas=document.querySelector('canvas');if(canvas){positionButtons();new ResizeObserver(positionButtons).observe(canvas);watch.disconnect();}});
 watch.observe(document.body,{childList:true,subtree:true});positionButtons();
 const speaker='<path d="M2 9H6V7H8V5H11V19H8V17H6V15H2Z"/>';
 const waves='<path d="M14 8H16V10H18V14H16V16H14V14H16V10H14ZM18 4H20V6H22V8H24V16H22V18H20V20H18V18H20V16H22V8H20V6H18Z"/>';
 const cross='<path d="M14 8H16V10H18V8H20V10H18V12H20V14H18V12H16V14H14V12H16V10H14Z"/>';
 const note='<path d="M8 5H20V8H10V18H8V5ZM18 7H20V16H18Z"/><path d="M4 16H10V20H4V18H2V16ZM14 14H20V18H14V16H12V14Z"/>';
 const slash='<path d="M2 2H5V5H8V8H11V11H14V14H17V17H20V20H23V23H20V21H17V18H14V15H11V12H8V9H5V6H2Z"/>';
 const icon=paths=>'<svg viewBox="0 0 24 24" fill="#ffd166" aria-hidden="true">'+paths+'</svg>';
 const syncSfx=()=>{
  sfxButton.innerHTML=icon(speaker+(sfxMuted?cross:waves));
  sfxButton.setAttribute('aria-pressed',String(sfxMuted));sfxButton.setAttribute('aria-label',sfxMuted?'Включить эффекты':'Отключить эффекты');
  window.dispatchEvent(new CustomEvent('bandwhack-mute',{detail:{muted:sfxMuted}}));
 };
 const syncMusic=()=>{
  musicButton.innerHTML=icon(note+(music.muted?slash:''));
  musicButton.setAttribute('aria-pressed',String(music.muted));musicButton.setAttribute('aria-label',music.muted?'Включить музыку':'Отключить музыку');
 };
 const play=()=>{started=true;music.play().catch(()=>{});};
 window.addEventListener('bandwhack-play',play);
 sfxButton.addEventListener('click',()=>{sfxMuted=!sfxMuted;syncSfx();});
 musicButton.addEventListener('click',()=>{music.muted=!music.muted;syncMusic();if(started&&!music.muted)play();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)music.pause();else if(started)play();});
 syncSfx();syncMusic();
})();
</script>

<script>
if(typeof Phaser!=='undefined'){
class BandWhack extends Phaser.Scene {
 preload(){
  this.load.image('stage-background',STAGE_BACKGROUND);
  this.load.image('chandelier',CHANDELIER_IMAGE);
  this.load.image('pixel-hole',HOLE_IMAGE);
  for(const [name,url] of Object.entries(CHARACTER_IMAGES))this.load.image(name,url);
 }
 create(){
  this.characters=Object.keys(CHARACTER_IMAGES);
  // 220 equal tickets: Kostyan22 (10%), MASHKOV/Yarik/Drew11 each (5%), others15 each.
  this.characterSpawnPool=this.characters.flatMap(name=>Array(name==='Kostyan'?22:['MASHKOV','Yarik','Drew'].includes(name)?11:15).fill(name));
  for(const name of this.characters){
   const texture=this.textures.get(name),image=texture.getSourceImage();
   const w=image.width/3,h=image.height/2;
   for(let i=0;i<5;i++)texture.add(i,0,Math.round((i%3)*w),Math.round(Math.floor(i/3)*h),Math.round(w),Math.round(h));
  }
  this.textures.get('pixel-hole').add('front',0,0,54,184,10);
  this.frameBaselines={"Struve": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Mirosh": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Drew": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Semenych": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Domik": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Glebas": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Egor": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Edik": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Bodya": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Tema": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Dariy": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Yarik": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "iiist": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "Kostyan": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875], "MASHKOV": [0.9921875, 0.9921875, 0.9921875, 0.9921875, 0.9921875]};
  this.animationSpeed=1.2;
  this.running=false;this.score=0;this.slots=[];
  this.hitCounts=Object.fromEntries(this.characters.map(name=>[name,0]));
  this.loadLifetimeHits();
  this.loadBestScore();
  const text=(x,y,value,size,color='#ffffff')=>this.add.text(x,y,value,{fontFamily:'Arial',fontSize:size+'px',color}).setOrigin(.5);
  const backdrop=this.add.image(230,560,'stage-background');
  const source=backdrop.texture.getSourceImage();
  backdrop.setScale(Math.max(720/source.width,1280/source.height));
  this.installSpotlights(backdrop);
  this.installSignGlitch(backdrop);
  // Hang from the top centre while preserving the previous resting position.
  const chandelierRestAngle=-10,chandelierHalfWidth=231;
  const chandelierRadians=chandelierRestAngle*Math.PI/180;
  const chandelier=this.add.image(-210+chandelierHalfWidth*Math.cos(chandelierRadians),-230+chandelierHalfWidth*Math.sin(chandelierRadians),'chandelier')
      .setOrigin(.5,0).setDisplaySize(462,462).setAngle(chandelierRestAngle);
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   this.tweens.add({targets:chandelier,angle:chandelierRestAngle-5,duration:2500,ease:'Sine.InOut',yoyo:true,repeat:-1});
  }

  this.scoreText=text(190,220,'СЧЁТ  0',32);
  this.timeText=text(535,220,'60 сек',32,'#ffd166');
  const progressTrack=this.add.rectangle(360,281,600,8,0x343b52);
  this.progress=this.add.rectangle(60,281,600,8,0xffd166).setOrigin(0,.5);
  this.roundHud=this.add.container(0,0,[this.scoreText,this.timeText,progressTrack,this.progress]).setVisible(false);
  const menuButton=this.add.rectangle(360,1056,240,72,0xffd166).setStrokeStyle(4,0x8b5b25).setInteractive({useHandCursor:true});
  const menuText=this.add.text(360,1056,'МЕНЮ',{fontFamily:'monospace',fontSize:'30px',color:'#241710'}).setOrigin(.5);
  this.menuControl=this.add.container(0,0,[menuButton,menuText]);
  menuButton.on('pointerdown',()=>this.showMenu());
  for(let row=0;row<3;row++)for(let col=0;col<3;col++){
   const x=160+col*200,y=425+row*225,base=y+89;
   this.add.image(x,base+10,'pixel-hole','__BASE').setOrigin(.5,1).setDisplaySize(198.378,68.598);
   const head=this.add.image(x,base+10,'Struve',0).setOrigin(.5,1).setDisplaySize(184,184).setInteractive({useHandCursor:true,pixelPerfect:true,alphaTolerance:80}).setVisible(false);
   // Fixed opening mask: open above the floor, curved along the inner front rim.
   const clip=this.make.graphics({x:0,y:0,add:false});

   head.setMask(clip.createGeometryMask());
   this.add.image(x,base+10,'pixel-hole','front').setOrigin(.5,1).setDisplaySize(198.378,11.124);
   const slot={head,base:base+10,baseY:base+10,clip,clipX:x-100,clipY:y-135,holeX:x,peekOffset:0,resolved:true,active:false,busy:false,timers:[]};this.slots.push(slot);
   slot.shine=this.add.graphics().setDepth(100).setMask(head.mask);
   this.updateHoleMask(slot);
   head.on('pointerdown',pointer=>{
    if(!this.running||!slot.active)return;
    if(!this.insideOpening(slot,pointer.worldX,pointer.worldY))return;
    if(this.time.now>=this.endsAt){this.finish();return;}
    this.acceptedPress=pointer;
    if(head.texture.key==='MASHKOV'){this.igniteMashkov(slot,pointer);return;}
    slot.resolved=true;
    this.cancelSlot(slot);slot.busy=true;
    this.pose(head,2);head.setVisible(true);
    this.later(slot,160/this.animationSpeed,()=>this.pose(head,3));
    this.later(slot,380/this.animationSpeed,()=>this.retreat(slot,316));
    this.hitCounts[head.texture.key]=(this.hitCounts[head.texture.key]||0)+1;
    this.recordLifetimeHit(head.texture.key);
    this.score+=25;this.scoreText.setText('СЧЁТ  '+this.score);
    this.hitImpact(pointer.worldX,pointer.worldY);
    this.game.canvas.dispatchEvent(new CustomEvent('bandwhack-hit',{bubbles:true,detail:{character:head.texture.key}}));
    const pop=text(x,y-100,'+25',36,'#67d8c3');
    this.tweens.add({targets:pop,y:y-135,alpha:0,duration:450,onComplete:()=>pop.destroy()});
   });
  }
  this.input.on('pointerdown',(pointer,currentlyOver)=>this.emptyPress(pointer,currentlyOver));
  this.status=text(360,1035,'',27,'#aeb8d2').setVisible(false);
  this.button=this.add.rectangle(360,1145,440,92,0xffd166).setInteractive({useHandCursor:true});

  const action=(y,label,callback)=>{
   const rect=this.add.rectangle(360,y,440,72,0xffd166).setStrokeStyle(3,0x8b5b25).setInteractive({useHandCursor:true});panel.add(rect);
   addText(360,y,label,28,'#241710').setOrigin(.5);rect.on('pointerdown',callback);
  };
  if(lifetime){
   addText(360,1050,this.statsStorageAvailable&&this.bestScoreStorageAvailable?'Сохранено на этом устройстве':'Статистика сейчас хранится в памяти',19,'#aaa0a2').setOrigin(.5);
   action(1170,'НАЗАД',()=>this.backToMenu());
  }else{
   addText(360,1050,'Только попадания · на очки не влияет',19,'#aaa0a2').setOrigin(.5);
   action(1130,'ЕЩЁ РАЗ',()=>this.startRound());
   action(1218,'МЕНЮ',()=>this.showMenu());
  }
  return panel;
 }
 finish(){
  if(!this.running)return;this.running=false;this.spawnTimer?.remove(false);
  this.slots.forEach(s=>{if(s.ignited)this.explodeMashkov(s,s.ignitionPointer);this.cancelSlot(s);s.busy=false;s.head.setVisible(false);s.shine.clear();});
  this.timeText.setText('0 сек');this.progress.width=0;
  this.roundHud.setVisible(false);this.menuControl.setVisible(true);
  this.status.setText('Время! Твой результат: '+this.score);
  this.recordBestScore();
  this.showHitStats();
  this.button.setDisplaySize(240,72).setStrokeStyle(4,0x8b5b25);
  this.buttonText.setText('ЕЩЁ РАЗ').setFontSize(30);
 }
}
new Phaser.Game({type:Phaser.AUTO,width:720,height:1280,backgroundColor:'#191d2c',pixelArt:true,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:BandWhack});
}
</script>
<script>
(()=>{
 let timer=null,activeCanvas=null,wiggle=null;
 const reset=()=>{clearTimeout(timer);timer=null;activeCanvas?.classList.remove('hammer-strike');activeCanvas=null;};
 document.addEventListener('pointerdown',event=>{
  if(!(event.target instanceof HTMLCanvasElement))return;
  reset();activeCanvas=event.target;activeCanvas.classList.add('hammer-strike');

  timer=setTimeout(reset,140);
 });
 for(const impactEvent of ['bandwhack-hit','bandwhack-explosion'])document.addEventListener(impactEvent,event=>{
  if(!(event.target instanceof HTMLCanvasElement))return;
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   wiggle?.cancel();
   wiggle=event.target.animate([
    {transform:'translate(0,0) rotate(0deg)'},
    {transform:'translate(-12px,8px) rotate(-0.65deg)'},
    {transform:'translate(11px,-7px) rotate(0.6deg)'},
    {transform:'translate(-8px,-5px) rotate(-0.45deg)'},
    {transform:'translate(6px,5px) rotate(0.3deg)'},
    {transform:'translate(-4px,3px) rotate(-0.18deg)'},
    {transform:'translate(2px,-2px) rotate(0.08deg)'},
    {transform:'translate(0,0) rotate(0deg)'}
   ],{duration:240,easing:'ease-out'});
  }
 });
 document.addEventListener('pointerout',event=>{if(event.target===activeCanvas)reset();});
 document.addEventListener('pointercancel',reset);
 window.addEventListener('blur',()=>{reset();wiggle?.cancel();wiggle=null;});
})();
</script>
